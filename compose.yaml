services:
  dashboard:
    build: .
    container_name: live-ai-dashboard
    env_file: .env
    ports:
      - "127.0.0.1:18090:8090"   # hanya localhost; dashboard belum memakai login
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: live-ai-dashboard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-live_ai}
      POSTGRES_USER: ${POSTGRES_USER:-live_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
